<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Equipment Overview - Camp Leader</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px 40px;
            position: relative;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .back-button {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            background: rgba(255,255,255,0.3);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .action-button {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-button:hover {
            background: rgba(255,255,255,0.3);
        }

        .header-content {
            text-align: center;
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .week-info-banner {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .week-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content {
            padding: 40px;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            min-height: 400px;
            justify-content: center;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #666;
            font-size: 1.2rem;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 0.95rem;
        }

        .data-table thead {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table th {
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            border-right: 1px solid rgba(255,255,255,0.2);
            white-space: nowrap;
        }

        .data-table th:last-child {
            border-right: none;
        }

        .data-table tbody tr {
            border-bottom: 1px solid #e0e0e0;
            transition: background-color 0.2s ease;
        }

        .data-table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .data-table tbody tr:last-child {
            border-bottom: none;
        }

        .data-table td {
            padding: 12px;
            border-right: 1px solid #e0e0e0;
            vertical-align: top;
        }

        .data-table td:last-child {
            border-right: none;
        }

        .data-table tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .data-table tbody tr:nth-child(even):hover {
            background-color: #e9ecef;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            text-align: center;
        }

        .summary-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .summary-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            display: none;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: #666;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #999;
            font-size: 1rem;
        }

        .error-message {
            display: none;
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .share-link-container {
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .share-link-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            font-family: monospace;
        }

        .copy-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .copy-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }

        .copy-button.copied {
            background: #27ae60;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .header-actions, .back-button, .share-link-container {
                display: none !important;
            }
            .container {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <button class="back-button" onclick="goBack()">← Back to Weeks</button>
                <div class="header-actions">
                    <button class="action-button" onclick="printPage()">
                        🖨️ Print
                    </button>
                    <button class="action-button" onclick="shareLink()">
                        🔗 Share Link
                    </button>
                </div>
            </div>
            <div class="header-content">
                <h1 id="pageTitle">⛷️ Winter Equipment Overview</h1>
                <p id="pageSubtitle">Loading...</p>
            </div>
            <div class="week-info-banner" id="weekInfoBanner"></div>
        </div>

        <div class="content">
            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <div class="loading-text">Loading equipment data...</div>
            </div>

            <div id="mainContent" style="display: none;">
                <div class="summary-cards" id="summaryCards"></div>
                
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Height (cm)</th>
                                <th>Shoe Size</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody">
                            <!-- Data will be populated here -->
                        </tbody>
                    </table>
                </div>

                <div class="empty-state" id="emptyState" style="display: none;">
                    <div class="empty-state-icon">⛷️</div>
                    <h3>No Data Available</h3>
                    <p>There are no participants for this week yet.</p>
                </div>
            </div>

            <div class="error-message" id="errorMessage" style="display: none;"></div>

            <div class="share-link-container" id="shareLinkContainer" style="display: none;">
                <input type="text" class="share-link-input" id="shareLinkInput" readonly>
                <button class="copy-button" id="copyButton" onclick="copyLink()">Copy Link</button>
            </div>
        </div>
    </div>

    <script>
        console.log('⛷️ Camp Leader Equipment Overview - Starting...');

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCaOMtd-Tl9bvTdMmLtDm0ALH9FctuVBoY",
            authDomain: "accommodation-management-57373.firebaseapp.com",
            projectId: "accommodation-management-57373",
            storageBucket: "accommodation-management-57373.firebasestorage.app",
            messagingSenderId: "905096938169",
            appId: "1:905096938169:web:715d8c7cb73d5c3aa61168",
            databaseURL: "https://accommodation-management-57373-default-rtdb.europe-west1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Configuration
        let config = {
            token: '',
            baseId: '',
            tables: {
                bookings: 'Bookings',
                kids: 'Kids'
            }
        };

        let weekData = {
            property: null,
            propertyName: null,
            weekNumber: null,
            startDate: null,
            endDate: null,
            season: null
        };

        // Load configuration from Firebase
        async function loadConfigFromFirebase() {
            try {
                console.log('📡 Loading Airtable config from Firebase...');
                const configRef = database.ref('config/airtable');
                const snapshot = await configRef.once('value');
                const configData = snapshot.val();

                if (configData && configData.token && configData.baseId) {
                    config.token = configData.token;
                    config.baseId = configData.baseId;
                    console.log('✅ Config loaded from Firebase');
                    return true;
                } else {
                    throw new Error('Invalid configuration data in Firebase');
                }
            } catch (error) {
                console.error('❌ Error loading config from Firebase:', error);
                return false;
            }
        }

        // Make Airtable API request
        async function makeAirtableRequest(tableName, offset = null) {
            const url = new URL(`https://api.airtable.com/v0/${config.baseId}/${encodeURIComponent(tableName)}`);
            if (offset) {
                url.searchParams.append('offset', offset);
            }

            const response = await fetch(url, {
                headers: {
                    'Authorization': `Bearer ${config.token}`
                }
            });

            if (!response.ok) {
                throw new Error(`Airtable API error: ${response.statusText}`);
            }

            const data = await response.json();
            
            // If there are more records, fetch them recursively
            if (data.offset) {
                const nextPage = await makeAirtableRequest(tableName, data.offset);
                return {
                    records: [...data.records, ...nextPage.records]
                };
            }
            
            return data;
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Initializing Equipment Overview...');
            
            // Get URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            weekData.property = urlParams.get('property');
            weekData.propertyName = urlParams.get('propertyName');
            weekData.weekNumber = urlParams.get('week');
            weekData.startDate = urlParams.get('startDate');
            weekData.endDate = urlParams.get('endDate');
            weekData.season = urlParams.get('season');

            console.log('Week Data:', weekData);

            // Update page title
            document.getElementById('pageTitle').textContent = `⛷️ Winter Equipment - Week ${weekData.weekNumber}`;
            document.getElementById('pageSubtitle').textContent = weekData.propertyName;

            // Update week info banner
            updateWeekInfoBanner();

            // Load config and then load data
            const configLoaded = await loadConfigFromFirebase();
            if (configLoaded) {
                await loadEquipmentData();
            } else {
                showError('Failed to load configuration. Please check your setup.');
            }
        });

        function updateWeekInfoBanner() {
            const banner = document.getElementById('weekInfoBanner');
            const startDate = new Date(weekData.startDate);
            const endDate = new Date(weekData.endDate);
            const startStr = formatDate(startDate);
            const endStr = formatDate(endDate);
            
            banner.innerHTML = `
                <div class="week-info-item">
                    <span>📅</span>
                    <span>Week ${weekData.weekNumber}</span>
                </div>
                <div class="week-info-item">
                    <span>📆</span>
                    <span>${startStr} - ${endStr}</span>
                </div>
                <div class="week-info-item">
                    <span>🏠</span>
                    <span>${weekData.propertyName}</span>
                </div>
            `;
        }

        function formatDate(date) {
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return date.toLocaleDateString('en-GB', options);
        }

        async function loadEquipmentData() {
            try {
                console.log('═══════════════════════════════════════════════════');
                console.log('⛷️ LOADING EQUIPMENT DATA');
                console.log('═══════════════════════════════════════════════════');
                
                // Load all bookings from Airtable
                const response = await makeAirtableRequest(config.tables.bookings);
                console.log('📦 Total bookings received:', response.records.length);
                
                // Load Kids data
                console.log('📡 Fetching Kids data...');
                const kidsResponse = await makeAirtableRequest(config.tables.kids);
                console.log('📦 Total kids received:', kidsResponse.records.length);
                
                // Create a map of kid IDs to kid info
                const kidsMap = {};
                kidsResponse.records.forEach(kid => {
                    const givenName = kid.fields['Given Name'] || '';
                    const familyName = kid.fields['Family Name'] || '';
                    const height = kid.fields['Height'] || '';
                    const shoeSize = kid.fields['Shoe Size'] || '';
                    
                    kidsMap[kid.id] = { 
                        firstName: givenName, 
                        surname: familyName,
                        height: height,
                        shoeSize: shoeSize
                    };
                    console.log(`  Kid ${kid.id}: ${givenName} ${familyName}, Height: ${height}cm, Shoe: ${shoeSize}`);
                });

                // Filter bookings that overlap with this week
                const weekStart = new Date(weekData.startDate);
                const weekEnd = new Date(weekData.endDate);
                weekEnd.setHours(23, 59, 59, 999);
                
                const weekBookings = response.records.filter(record => {
                    const fields = record.fields;
                    
                    // Check property match
                    const bookingProperty = fields['Property'];
                    const propertyFromCamp = fields['Property (from Camp)'];
                    let propertyId = null;
                    
                    if (bookingProperty) {
                        propertyId = Array.isArray(bookingProperty) ? bookingProperty[0] : bookingProperty;
                    } else if (propertyFromCamp) {
                        propertyId = Array.isArray(propertyFromCamp) ? propertyFromCamp[0] : propertyFromCamp;
                    }
                    
                    const propertyMatches = propertyId === weekData.property;
                    if (!propertyMatches) return false;
                    
                    // Check date overlap
                    const arrivalDate = fields['Arrival Date'];
                    if (!arrivalDate) return false;
                    
                    const arrival = new Date(arrivalDate);
                    const departureDate = fields['Departure Date'];
                    const departure = departureDate ? new Date(departureDate) : null;
                    
                    const arrivalInWeek = arrival >= weekStart && arrival <= weekEnd;
                    const departureInWeek = departure && departure >= weekStart && departure <= weekEnd;
                    const spansWeek = arrival <= weekStart && (!departure || departure >= weekEnd);
                    
                    return arrivalInWeek || departureInWeek || spansWeek;
                }).map(record => {
                    const fields = record.fields;
                    
                    // Get kid info
                    let firstName = '';
                    let surname = '';
                    let height = '';
                    let shoeSize = '';
                    
                    const kidsOnTrip = fields['Kids on Trip'];
                    if (kidsOnTrip && Array.isArray(kidsOnTrip) && kidsOnTrip.length > 0) {
                        const kidId = kidsOnTrip[0];
                        if (kidsMap[kidId]) {
                            firstName = kidsMap[kidId].firstName;
                            surname = kidsMap[kidId].surname;
                            height = kidsMap[kidId].height;
                            shoeSize = kidsMap[kidId].shoeSize;
                        }
                    }
                    
                    // Fallback: Extract from booking name if Kids lookup failed
                    if (!firstName && !surname) {
                        const bookingName = fields['Booking Name'] || '';
                        const nameParts = bookingName.split(' - ');
                        
                        if (nameParts.length >= 3) {
                            const kidName = nameParts[nameParts.length - 1].trim();
                            const nameWords = kidName.split(' ');
                            firstName = nameWords[0] || '';
                            surname = nameWords.slice(1).join(' ') || '';
                        }
                    }
                    
                    return {
                        firstName: firstName,
                        surname: surname,
                        height: height || '-',
                        shoeSize: shoeSize || '-'
                    };
                });

                console.log('═══════════════════════════════════════════════════');
                console.log('✅ FILTERING COMPLETE');
                console.log('Bookings matching this week:', weekBookings.length);
                console.log('═══════════════════════════════════════════════════');

                displayEquipmentData(weekBookings);
                updateSummaryCards(weekBookings);
                
            } catch (error) {
                console.error('❌ Error loading equipment data:', error);
                showError('Failed to load equipment data: ' + error.message);
            } finally {
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            }
        }

        function displayEquipmentData(bookings) {
            const tbody = document.getElementById('dataTableBody');
            
            if (bookings.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
                document.querySelector('.table-container').style.display = 'none';
                return;
            }

            tbody.innerHTML = bookings.map(booking => `
                <tr>
                    <td>${booking.firstName}</td>
                    <td>${booking.surname}</td>
                    <td>${booking.height}</td>
                    <td>${booking.shoeSize}</td>
                </tr>
            `).join('');
        }

        function updateSummaryCards(bookings) {
            const totalKids = bookings.length;
            const withHeight = bookings.filter(b => b.height !== '-').length;
            const withShoeSize = bookings.filter(b => b.shoeSize !== '-').length;

            document.getElementById('summaryCards').innerHTML = `
                <div class="summary-card">
                    <div class="summary-number">${totalKids}</div>
                    <div class="summary-label">Total Participants</div>
                </div>
                <div class="summary-card">
                    <div class="summary-number">${withHeight}</div>
                    <div class="summary-label">With Height Info</div>
                </div>
                <div class="summary-card">
                    <div class="summary-number">${withShoeSize}</div>
                    <div class="summary-label">With Shoe Size Info</div>
                </div>
            `;
        }

        function goBack() {
            const url = `camp-leader-weeks.html?property=${weekData.property}&propertyName=${encodeURIComponent(weekData.propertyName)}&showWeeks=true`;
            window.location.href = url;
        }

        function printPage() {
            window.print();
        }

        function shareLink() {
            const container = document.getElementById('shareLinkContainer');
            const input = document.getElementById('shareLinkInput');
            
            input.value = window.location.href;
            container.style.display = 'flex';
            input.select();
        }

        function copyLink() {
            const input = document.getElementById('shareLinkInput');
            const button = document.getElementById('copyButton');
            
            input.select();
            document.execCommand('copy');
            
            button.textContent = '✓ Copied!';
            button.classList.add('copied');
            
            setTimeout(() => {
                button.textContent = 'Copy Link';
                button.classList.remove('copied');
            }, 2000);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
