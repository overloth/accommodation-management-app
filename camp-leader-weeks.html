<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp Leader Weekly Overview - friLingue</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 40px;
            text-align: center;
            position: relative;
        }

        .back-button {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            background: rgba(255,255,255,0.3);
        }

        .header-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 40px;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            min-height: 400px;
            justify-content: center;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #666;
            font-size: 1.2rem;
        }

        .properties-section {
            display: none;
        }

        .properties-section.active {
            display: block;
        }

        .section-title {
            color: #2c3e50;
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 600;
            text-align: center;
        }

        .section-subtitle {
            color: #666;
            font-size: 1rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .property-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            text-align: center;
        }

        .property-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border-color: #3498db;
        }

        .property-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .property-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .property-location {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .weeks-section {
            display: none;
        }

        .weeks-section.active {
            display: block;
        }

        .season-container {
            margin-bottom: 20px;
        }

        .season-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            border-left: 5px solid;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .season-header:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .season-header.winter {
            border-left-color: #3498db;
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
        }

        .season-header.spring {
            border-left-color: #2ecc71;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
        }

        .season-header.summer {
            border-left-color: #f39c12;
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
        }

        .season-header.autumn {
            border-left-color: #e74c3c;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
        }

        .season-header-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .season-icon {
            font-size: 2.5rem;
        }

        .season-title {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
            margin: 0;
        }

        .season-subtitle {
            font-size: 1.1rem;
            color: #666;
            margin: 0;
        }

        .accordion-arrow {
            font-size: 1.5rem;
            color: #666;
            transition: transform 0.3s ease;
        }

        .season-header.active .accordion-arrow {
            transform: rotate(180deg);
        }

        .weeks-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
        }

        .weeks-container.active {
            max-height: 5000px;
            transition: max-height 0.6s ease-in;
        }

        .weeks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
            padding-top: 25px;
        }

        .week-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            text-align: center;
        }

        .week-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border-color: #3498db;
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
        }

        .week-dates {
            font-size: 1.1rem;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .week-info {
            color: #666;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .view-week-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            margin-top: 15px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }

        .view-week-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.4);
        }

        .view-equipment-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            margin-top: 10px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
            width: 100%;
        }

        .view-equipment-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.4);
        }

        .selected-property-banner {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            text-align: center;
        }

        .selected-property-banner h3 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .selected-property-banner p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .error-message {
            display: none;
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .error-message.show {
            display: block;
        }

        .no-weeks-message {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.2rem;
        }

        .season-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px 20px;
            background: rgba(0,0,0,0.03);
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }

        .season-link-btn {
            display: block;
            flex: 1 1 0;
            padding: 10px 8px;
            border-radius: 8px;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(52,152,219,0.25);
            text-align: center;
        }

        .season-link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52,152,219,0.4);
            opacity: 0.95;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-button" onclick="goBack()">← Back</button>
            <h1>Weekly Camp Overview</h1>
            <p>Select a property and week to view camp details</p>
        </div>

        <div class="content">
            <!-- Loading Indicator -->
            <div id="loadingIndicator" class="loading">
                <div class="spinner"></div>
                <div class="loading-text" id="loadingText"></div>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="error-message"></div>

            <!-- Properties Selection Section -->
            <div id="propertiesSection" class="properties-section">
                <h2 class="section-title">Select a Property</h2>
                <p class="section-subtitle">Choose a property to view weekly schedules</p>
                <div id="propertiesGrid" class="properties-grid"></div>
            </div>

            <!-- Weeks Section (Organized by Season) -->
            <div id="weeksSection" class="weeks-section">
                <div class="selected-property-banner" id="selectedPropertyInfo"></div>
                <div id="seasonsContainer"></div>
                <div id="noWeeksMessage" class="no-weeks-message" style="display: none;">
                    No weeks available for the selected property.
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        let config = {
            baseId: '',
            token: '',
            tables: {
                properties: 'Properties',
                bookings: 'Bookings',
                camps: 'Camps',
                seasonLinks: 'Seasons_links'
            }
            
        };

        // State
        let properties = [];
        let selectedProperty = null;
        let campData = [];
        let bookedWeekDates = new Set();
        let seasonLinksData = {};

        // Season configurations
        const seasonConfig = {
            winter: {
                name: 'Winter',
                icon: '❄️',
                class: 'winter',
                // Beginning of December -> including first week of April
                startMonth: 12,
                endMonth: 3,
                endDay: 7 // First week of April
            },
            spring: {
                name: 'Spring',
                icon: '🌸',
                class: 'spring',
                // Second week of April -> end of May
                startMonth: 4,
                startDay: 8, // Second week of April
                endMonth: 5
            },
            summer: {
                name: 'Summer',
                icon: '☀️',
                class: 'summer',
                // Whole June -> till middle of September
                startMonth: 6,
                endMonth: 9,
                endDay: 15 // Middle of September
            },
            autumn: {
                name: 'Autumn',
                icon: '🍂',
                class: 'autumn',
                // From middle of September -> end of November
                startMonth: 9,
                startDay: 16, // From middle of September
                endMonth: 11
            }
        };

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCaOMtd-Tl9bvTdMmLtDm0ALH9FctuVBoY",
            authDomain: "accommodation-management-57373.firebaseapp.com",
            projectId: "accommodation-management-57373",
            storageBucket: "accommodation-management-57373.firebasestorage.app",
            messagingSenderId: "905096938169",
            appId: "1:905096938169:web:715d8c7cb73d5c3aa61168",
            databaseURL: "https://accommodation-management-57373-default-rtdb.europe-west1.firebasedatabase.app"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Load configuration from Firebase
        async function loadConfigFromFirebase() {
            try {
                console.log('🔄 Loading configuration from Firebase...');
                const configRef = database.ref('config/airtable');
                const snapshot = await configRef.once('value');
                const data = snapshot.val();
                
                console.log('📦 Firebase data received:', data);
                
                if (data && data.token && data.baseId) {
                    config.token = data.token;
                    config.baseId = data.baseId;
                    
                    if (data.tables) {
                        config.tables = { ...config.tables, ...data.tables };
                    }
                    
                    console.log('✅ Configuration loaded successfully');
                    console.log('📋 Base ID:', config.baseId);
                    console.log('📋 Tables:', config.tables);
                    return true;
                } else {
                    console.error('❌ Configuration incomplete or missing');
                    console.error('Data received:', data);
                    return false;
                }
            } catch (error) {
                console.error('❌ Error loading configuration:', error);
                console.error('Error details:', error.message, error.stack);
                return false;
            }
        }

        // Make Airtable request
        async function makeAirtableRequest(table, filterFormula = '') {
            if (!config.token || !config.baseId) {
                throw new Error('Airtable configuration missing');
            }
            
            // Handle pagination to get ALL records
            let allRecords = [];
            let offset = null;
            
            do {
                let url = `https://api.airtable.com/v0/${config.baseId}/${table}`;
                const params = [];
                
                if (filterFormula) {
                    params.push(`filterByFormula=${encodeURIComponent(filterFormula)}`);
                }
                if (offset) {
                    params.push(`offset=${offset}`);
                }
                if (params.length > 0) {
                    url += `?${params.join('&')}`;
                }
                
                console.log('📡 Fetching from Airtable:', url);
                
                const options = {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${config.token}`,
                        'Content-Type': 'application/json'
                    }
                };
                
                const response = await fetch(url, options);
                if (!response.ok) {
                    throw new Error(`Airtable API error: ${response.status} ${response.statusText}`);
                }
                
                const result = await response.json();
                allRecords = allRecords.concat(result.records);
                offset = result.offset;
                
                console.log(`Fetched ${result.records.length} records from ${table}, total so far: ${allRecords.length}`);
            } while (offset);
            
            console.log(`✅ Total records fetched from ${table}: ${allRecords.length}`);
            return { records: allRecords };
        }

        // Load camp data from Airtable
        async function loadCampData() {
            try {
                console.log('🏕️ Loading camp data...');
                const response = await makeAirtableRequest(config.tables.camps);
                console.log('📦 Raw camp response:', response);
                
                campData = response.records.map(record => {
                    console.log('Processing camp record:', record.fields);
                    return {
                        id: record.id,
                        season: record.fields['Season'] || '',
                        startDate: record.fields['Camp Start Date'] ? new Date(record.fields['Camp Start Date']) : null,
                        endDate: record.fields['Camp End Date'] ? new Date(record.fields['Camp End Date']) : null
                    };
                }).filter(camp => camp.startDate && camp.endDate);
                
                console.log('✅ Loaded', campData.length, 'camps with valid dates');
                console.log('Camp data sample:', campData.slice(0, 3));
                return campData;
            } catch (error) {
                console.error('❌ Error loading camp data:', error);
                console.error('Error details:', error.message);
                // Don't fail completely - we can still generate weeks without camp data
                return [];
            }
        }

        async function loadSeasonLinks(propertyId) {
            try {
                const response = await makeAirtableRequest(config.tables.seasonLinks);
                seasonLinksData = {};

                console.log('🔗 Total Season Links records:', response.records.length);
                console.log('🔗 Looking for propertyId:', propertyId);

                response.records.forEach(record => {
                    const fields = record.fields;

                    console.log('RAW FIELDS:', JSON.stringify(fields));  // ← ADD THIS

                    const linkedProperties = fields['Properties'];
                    const season = (fields['Season'] || '').toLowerCase();

                    console.log('🔗 Record:', fields['Name'] || record.id);

                    if (!linkedProperties || !season) return;

                    const propIds = Array.isArray(linkedProperties) ? linkedProperties : [linkedProperties];
                    if (!propIds.includes(propertyId)) return;

                    const key = `${propertyId}-${season}`;
                    seasonLinksData[key] = {
                        finance:          fields['Finance'] || '',
                        bz:               fields['BZ'] || '',
                        airportTransfer:  fields['Airport Transfer'] || '',
                        staff:            fields['Staff'] || '',
                        volunteer:        fields['Volunteer'] || '',
                        excursion:        fields['Excursion'] || ''
                    };
                });

                console.log('✅ Season links loaded:', seasonLinksData);
            } catch (error) {
                console.error('❌ Error loading season links:', error);
            }
        }

        // Determine season from date
        function getSeasonFromDate(date) {
            const month = date.getMonth() + 1; // 1-12
            const day = date.getDate();
            
            // Winter: Beginning of December -> including first week of April
            if (month === 12 || month === 1 || month === 2 || month === 3) {
                return 'winter';
            }
            
            // Spring: Second week of April -> end of May
            if (month === 4  || month === 5) {
                return 'spring';
            }
            
            // Summer: Whole June -> till middle of September
            if (month === 6 || month === 7 || month === 8 || 
                (month === 9 && day <= 15)) {
                return 'summer';
            }
            
            // Autumn: From middle of September -> end of November
            if ((month === 9 && day >= 16) || month === 10 || month === 11) {
                return 'autumn';
            }
            
            return 'winter'; // Default fallback
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 App starting...');
            const configLoaded = await loadConfigFromFirebase();
            console.log('Config loaded:', configLoaded);
            
            if (configLoaded) {
                try {
                    // Load camp data first (but don't fail if it errors)
                    console.log('Loading camp data...');
                    await loadCampData();
                    console.log('Camp data loaded, count:', campData.length);
                } catch (error) {
                    console.error('Failed to load camp data, but continuing:', error);
                }
                
                // Check if we should show weeks directly (coming back from detail page)
                const urlParams = new URLSearchParams(window.location.search);
                const showWeeks = urlParams.get('showWeeks');
                const propertyId = urlParams.get('property');
                const propertyName = urlParams.get('propertyName');
                
                console.log('URL params:', { showWeeks, propertyId, propertyName });
                
                if (showWeeks === 'true' && propertyId && propertyName) {
                    console.log('Showing weeks directly for property:', propertyId);
                    document.getElementById('loadingText').textContent = 'Loading weeks for ' + decodeURIComponent(propertyName) + '...';
                    // Directly show weeks for this property
                    await loadProperties();
                    const property = properties.find(p => p.id === propertyId);
                    if (property) {
                        selectProperty(property.id);
                    } else {
                        // Property not found, create it from URL params
                        selectProperty(propertyId, decodeURIComponent(propertyName));
                    }
                } else {
                    console.log('Loading properties normally...');
                    await loadProperties();
                }
            } else {
                console.error('Config not loaded, showing error');
                showError('Airtable configuration not found. Please set up the configuration in the main app.');
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        });

        function goBack() {
            // If weeks section is visible, go back to property selection
            if (document.getElementById('weeksSection').classList.contains('active')) {
                document.getElementById('seasonsContainer').innerHTML = '';
                document.getElementById('weeksSection').classList.remove('active');
                document.getElementById('propertiesSection').classList.add('active');
            } else {
                window.location.href = 'index.html';
            }
        }

        async function loadProperties() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const propertiesSection = document.getElementById('propertiesSection');
            const errorMessage = document.getElementById('errorMessage');

            try {
                console.log('🏢 Loading properties...');
                console.log('Using table name:', config.tables.properties);
                
                const response = await makeAirtableRequest(config.tables.properties);
                console.log('📦 Received', response.records.length, 'properties from Airtable');

                properties = response.records
                    .filter(record => {
                        const countryName = record.fields['Country Name (from Property Country)'];
                        const isSwiss = countryName === 'Switzerland' || 
                                       (Array.isArray(countryName) && countryName.includes('Switzerland'));
                        console.log('Property:', record.fields['Property Name'], 'Country:', countryName, 'Is Swiss:', isSwiss);
                        return isSwiss;
                    })
                    .map((record, index) => ({
                        id: record.id,
                        name: record.fields['Property Name'] || 'Unknown',
                        location: record.fields['Property Street Address'] || 'Switzerland'
                    }));

                console.log('✅ Found', properties.length, 'properties in Switzerland');
                console.log('Properties:', properties);

                if (properties.length === 0) {
                    showError('No Swiss properties found in Airtable.');
                } else {
                    displayProperties();
                }
            } catch (error) {
                console.error('❌ Error loading properties:', error);
                console.error('Error stack:', error.stack);
                showError('Failed to load properties: ' + error.message + '. Make sure your Airtable configuration is set up in the main app.');
            } finally {
                document.getElementById('loadingText').textContent = 'Loading properties...';
                loadingIndicator.style.display = 'none';
                propertiesSection.classList.add('active');
            }
        }

        function displayProperties() {
            const grid = document.getElementById('propertiesGrid');
            grid.innerHTML = properties.map(property => `
                <div class="property-card" onclick="selectProperty('${property.id}')">
                    <div class="property-name">${property.name}</div>
                    <div class="property-location">${property.location}</div>
                    <button class="view-week-btn" onclick="event.stopPropagation(); selectProperty('${property.id}')">
                        View Weeks
                    </button>
                </div>
            `).join('');
        }

       async function selectProperty(propertyIdOrObj, propertyNameParam = null) {
            // Handle both object and ID+name parameters
            if (typeof propertyIdOrObj === 'object') {
                selectedProperty = propertyIdOrObj;
            } else {
                // Coming from URL parameters
                selectedProperty = properties.find(p => p.id === propertyIdOrObj) || {
                    id: propertyIdOrObj,
                    name: propertyNameParam || 'Unknown Property',
                    location: '',
                    icon: '🏠'
                };
            }
            
            if (!selectedProperty) return;

            // Show selected property info
            document.getElementById('selectedPropertyInfo').innerHTML = `
                <h3>${selectedProperty.name}</h3>
                <p>${selectedProperty.location}</p>
            `;

            // Hide properties section, show weeks section
            document.getElementById('propertiesSection').classList.remove('active');
            document.getElementById('loadingText').textContent = 'Loading weeks for ' + selectedProperty.name + '...';
            document.getElementById('loadingIndicator').style.display = 'flex';
            // Generate weeks organized by seasons
            // generateSeasonalWeeks();

            await Promise.all([
                loadBookingsAndGenerateWeeks(),
                loadSeasonLinks(selectedProperty.id)
            ]);

            generateSeasonalWeeks();

            document.getElementById('loadingIndicator').style.display = 'none';
            document.getElementById('weeksSection').classList.add('active');
        }

        async function loadBookingsAndGenerateWeeks() {
            try {
                const response = await makeAirtableRequest(config.tables.bookings);
                
                bookedWeekDates = new Set();
                
                response.records.forEach(record => {
                    const fields = record.fields;
                    
                    // Match using same logic as detail page (property ID → name → camp name)
                    const bookingProperty = fields['Property'];
                    const propertyFromCamp = fields['Property (from Camp)'];
                    let bookingPropertyId = null;
                    if (bookingProperty) {
                        bookingPropertyId = Array.isArray(bookingProperty) ? bookingProperty[0] : bookingProperty;
                    } else if (propertyFromCamp) {
                        bookingPropertyId = Array.isArray(propertyFromCamp) ? propertyFromCamp[0] : propertyFromCamp;
                    }

                    const propertyNameField = fields['Property (from Property)'] || fields['Property Name'];
                    const propertyNameStr = Array.isArray(propertyNameField) ? propertyNameField[0] : propertyNameField;

                    const campName = fields['Camp Name (from Camp)'];
                    const campNameStr = Array.isArray(campName) ? campName[0] : (campName || '');
                    const propertyFirstWord = selectedProperty.name.split(' ')[0];

                    const propertyMatches = bookingPropertyId === selectedProperty.id ||
                                            (propertyNameStr && propertyNameStr.includes(selectedProperty.name)) ||
                                            campNameStr.includes(propertyFirstWord);

                    if (!propertyMatches) return;
                    
                    // Get arrival date and find which week it belongs to
                    const arrivalDate = fields['Arrival Date'];
                    if (!arrivalDate) return;
                    
                    const arrival = new Date(arrivalDate);
                    // Find the Sunday of this week
                    const sunday = new Date(arrival);
                    sunday.setDate(arrival.getDate() - arrival.getDay());
                    sunday.setHours(0, 0, 0, 0);
                    const y = sunday.getFullYear();
                    const m = String(sunday.getMonth() + 1).padStart(2, '0');
                    const d = String(sunday.getDate()).padStart(2, '0');
                    bookedWeekDates.add(`${y}-${m}-${d}`);
                });
                
                console.log('✅ Booked weeks found:', bookedWeekDates.size);
                // generateSeasonalWeeks();
                
            } catch (error) {
                console.error('Error loading bookings:', error);
                // Fall back to showing all weeks if bookings fail to load
                // generateSeasonalWeeks();
            }
        }

        function generateSeasonalWeeks() {
            // Start from December 2025 (upcoming season)
            const today = new Date();
            let earliestDate = new Date('2025-12-01'); // Start from December 2025
            let latestDate = new Date('2026-11-30'); // Go through end of 2027
            
            // If camp data exists, use it to refine the date range
            if (campData.length > 0) {
                const campDates = campData.map(c => c.startDate).filter(d => d);
                const campEndDates = campData.map(c => c.endDate).filter(d => d);
                
                if (campDates.length > 0) {
                    const minCampDate = new Date(Math.min(...campDates));
                    const maxCampDate = new Date(Math.max(...campEndDates));
                    
                    // Only use camp dates if they're in the future or current
                    if (minCampDate >= earliestDate) {
                        earliestDate = minCampDate;
                    }
                    if (maxCampDate > latestDate) {
                        latestDate = maxCampDate;
                    }
                }
            }
            
            console.log('📅 Generating weeks from', earliestDate, 'to', latestDate);
            
            // Generate all weeks
            const allWeeks = [];
            let currentWeekStart = new Date(earliestDate);
            
            // Adjust to Sunday
            currentWeekStart.setDate(currentWeekStart.getDate() - currentWeekStart.getDay());
            
            while (currentWeekStart <= latestDate) {
                const weekEnd = new Date(currentWeekStart);
                weekEnd.setDate(weekEnd.getDate() + 6); // Sunday to Saturday
                
                const season = getSeasonFromDate(currentWeekStart);
                
                allWeeks.push({
                    startDate: new Date(currentWeekStart),
                    endDate: weekEnd,
                    season: season
                });
                
                currentWeekStart.setDate(currentWeekStart.getDate() + 7);
            }
            
            // Group weeks by season and year
            const seasonalWeeks = {
                winter: [],
                spring: [],
                summer: [],
                autumn: []
            };
            
            allWeeks.forEach(week => {
                if (week.season && seasonalWeeks[week.season]) {
                    // Only include weeks that have at least one booking
                    const sd = week.startDate;
                    const weekKey = `${sd.getFullYear()}-${String(sd.getMonth()+1).padStart(2,'0')}-${String(sd.getDate()).padStart(2,'0')}`;
                    if (bookedWeekDates.size === 0 || bookedWeekDates.has(weekKey)) {
                        seasonalWeeks[week.season].push(week);
                    }
                }
            });
            
            // Display weeks organized by season
            displaySeasonalWeeks(seasonalWeeks);
        }

        function displaySeasonalWeeks(seasonalWeeks) {
            const container = document.getElementById('seasonsContainer');
            const noWeeksMessage = document.getElementById('noWeeksMessage');
            
            let hasWeeks = false;
            let html = '';
            
            // Display seasons in order: Winter, Spring, Summer, Autumn
            const seasonOrder = ['winter', 'spring', 'summer', 'autumn'];
            
            seasonOrder.forEach((seasonKey, index) => {
                const weeks = seasonalWeeks[seasonKey];
                if (weeks && weeks.length > 0) {
                    hasWeeks = true;
                    const season = seasonConfig[seasonKey];
                    const isFirstSeason = index === 0;
                    
                    const links = seasonLinksData[`${selectedProperty.id}-${seasonKey}`] || {};
                    const linkButtons = [
                        { label: 'Finance',           key: 'finance' },
                        { label: 'BZ',               key: 'bz' },
                        { label: 'Airport Transfer',  key: 'airportTransfer' },
                        { label: 'Staff',             key: 'staff' },
                        { label: 'Volunteer',         key: 'volunteer' },
                        { label: 'Excursion',         key: 'excursion' }
                    ].filter(btn => links[btn.key]); // only show buttons that have a URL

                    const buttonsHtml = linkButtons.length > 0 ? `
                        <div class="season-links" onclick="event.stopPropagation()">
                            ${linkButtons.map(btn => `
                                <a href="${links[btn.key]}" target="_blank" rel="noopener" class="season-link-btn">
                                    ${btn.label}
                                </a>
                            `).join('')}
                        </div>
                    ` : '';

                    html += `
                        <div class="season-container">
                            <div class="season-header ${season.class} ${isFirstSeason ? 'active' : ''}" onclick="toggleSeason('${seasonKey}')">
                                <div class="season-header-content">
                                    <div>
                                        <h2 class="season-title">${season.name}</h2>
                                        <p class="season-subtitle">${weeks.length} weeks</p>
                                    </div>
                                </div>
                                <div class="accordion-arrow">▼</div>
                            </div>
                            <div class="weeks-container ${isFirstSeason ? 'active' : ''}" id="weeks-${seasonKey}">
                                ${buttonsHtml}

                                <div class="weeks-grid">
                                    ${weeks.map((week, index) => {
                                        const weekNumber = index + 1; // Reset week numbering for each season
                                        const startStr = formatDate(week.startDate);
                                        const endStr = formatDate(week.endDate);
                                        
                                        // Check if this is winter season
                                        const isWinter = seasonKey === 'winter';
                                        
                                        return `
                                            <div class="week-card" onclick="viewWeek(${weekNumber}, '${week.startDate.toISOString()}', '${week.endDate.toISOString()}', '${seasonKey}')">
                                                <div class="week-dates">${startStr} - ${endStr}</div>
                                                <div class="week-info" style="font-size: 0.75rem; color: #666; margin-top: 5px;">Sunday - Saturday</div>
                                                <button class="view-week-btn" onclick="event.stopPropagation(); viewWeek(${weekNumber}, '${week.startDate.toISOString()}', '${week.endDate.toISOString()}', '${seasonKey}')">
                                                    View Week Details
                                                </button>
                                                ${isWinter ? `
                                                <button class="view-equipment-btn" onclick="event.stopPropagation(); viewEquipment(${weekNumber}, '${week.startDate.toISOString()}', '${week.endDate.toISOString()}', '${seasonKey}')" style="margin-top: 10px; background: linear-gradient(135deg, #667eea, #764ba2);">
                                                    Winter Equipment
                                                </button>
                                                ` : ''}
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                }
            });
            
            if (hasWeeks) {
                container.innerHTML = html;
                noWeeksMessage.style.display = 'none';
            } else {
                container.innerHTML = '';
                noWeeksMessage.style.display = 'block';
            }
        }

        // Toggle season accordion
        function toggleSeason(seasonKey) {
            const header = document.querySelector(`.season-header.${seasonKey}`);
            const container = document.getElementById(`weeks-${seasonKey}`);
            
            if (!header || !container) return;
            
            // Toggle active state
            const isActive = container.classList.contains('active');
            
            if (isActive) {
                // Close this season
                header.classList.remove('active');
                container.classList.remove('active');
            } else {
                // Open this season
                header.classList.add('active');
                container.classList.add('active');
            }
        }

        function formatDate(date) {
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return date.toLocaleDateString('en-GB', options);
        }

        function viewWeek(weekNumber, startDate, endDate, season) {
            // Create URL with parameters including season
            const url = `camp-leader-week-detail.html?property=${selectedProperty.id}&propertyName=${encodeURIComponent(selectedProperty.name)}&week=${weekNumber}&startDate=${startDate}&endDate=${endDate}&season=${season}`;
            window.location.href = url;
        }

        function viewEquipment(weekNumber, startDate, endDate, season) {
            // Create URL for winter equipment page
            const url = `camp-leader-equipment.html?property=${selectedProperty.id}&propertyName=${encodeURIComponent(selectedProperty.name)}&week=${weekNumber}&startDate=${startDate}&endDate=${endDate}&season=${season}`;
            window.location.href = url;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            console.error('💥 Showing error to user:', message);
        }
    </script>
